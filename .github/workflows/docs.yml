name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "overrides/**"
      - "cmd/**"
      - "internal/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/pygments-dad/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the playground (Go → WebAssembly)
        run: |
          mkdir -p docs/assets/playground
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o docs/assets/playground/dad.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/assets/playground/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
