name: Release

# Push a version tag to publish a release, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Optional: add these repository secrets to also publish the extension to the
      # VS Code Marketplace and Open VSX. Without them those steps are skipped.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: go test ./...

      - name: Build binaries
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="dad_${os}_${arch}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "build/$name/dad$ext" ./cmd/dad
            cp README.md LICENSE "build/$name/"
            if [ "$os" = "windows" ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done

      - name: Test and package the VS Code extension
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          go build -o build/dad ./cmd/dad
          cd editors/vscode
          node test/grammar.test.js
          DAD="../../build/dad" node test/extension.test.js
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.version=process.argv[1];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")' "$version"
          npx --yes @vscode/vsce@3 package --no-dependencies -o ../../dist/dad-lang.vsix

      - name: Checksums
        run: |
          (cd dist && sha256sum * > checksums.txt)
          cp install.sh install.ps1 dist/
          ls -l dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Ḍād $GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --packagePath dist/dad-lang.vsix --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0 publish dist/dad-lang.vsix --pat "$OVSX_PAT"
