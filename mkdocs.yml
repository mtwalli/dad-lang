site_name: Ḍād · ضاد
site_description: A modern Arabic programming language for complete web apps — UI, server and data in one language.
# After creating the GitHub repository, set these two lines (replace YOUR-USER):
# site_url: https://YOUR-USER.github.io/dad-lang/
# repo_url: https://github.com/YOUR-USER/dad-lang

docs_dir: docs

nav:
  - Home: index.md
  - Language specification: SPEC.md
  - Grammar: grammar.md
  - Examples: examples.md
  - Roadmap: ROADMAP.md

theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans Arabic
    code: JetBrains Mono
  icon:
    logo: material/translate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: [en, ar]

extra_css:
  - assets/dad.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

exclude_docs: |
  grammar.ebnf
