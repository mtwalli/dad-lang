site_name: Ḍād · ضاد
site_description: A modern Arabic programming language for complete web apps — UI, server and data in one language.
site_url: https://mtwalli.github.io/dad-lang/
repo_url: https://github.com/mtwalli/dad-lang
repo_name: mtwalli/dad-lang
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Install: install.md
  - Playground: playground.md
  - Language specification: SPEC.md
  - Grammar: grammar.md
  - Examples: examples.md
  - Roadmap: ROADMAP.md

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans Arabic
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - navigation.footer

plugins:
  - search:
      lang: [en, ar]

extra_css:
  - assets/dad.css

extra_javascript:
  - assets/playground.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

exclude_docs: |
  grammar.ebnf
