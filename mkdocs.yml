# Arabic is the main site (at /); English is built under /en/.
# Pages: page.md is Arabic, page.en.md is English (mkdocs-static-i18n, suffix structure).
site_name: ضاد · Ḍād
site_description: لغة برمجة عربية حديثة لتطبيقات الويب الكاملة، بواجهتها وخادمها وبياناتها.
site_url: https://mtwalli.github.io/dad-lang/
copyright: ضاد منشورة برخصة <a href="https://github.com/mtwalli/dad-lang/blob/main/LICENSE">MIT</a>
repo_url: https://github.com/mtwalli/dad-lang
repo_name: mtwalli/dad-lang
edit_uri: edit/main/docs/

docs_dir: docs

nav:
- الرئيسية: index.md
- البداية:
    - التثبيت: install.md
    - تعلّم ضاد:
        - tutorial/index.md
        - ١. البداية: tutorial/01-start.md
        - ٢. القيم والأسماء: tutorial/02-values.md
        - ٣. القرارات والتكرار: tutorial/03-control.md
        - ٤. الدوال: tutorial/04-functions.md
        - ٥. القوائم والقواميس: tutorial/05-lists.md
        - ٦. الأنواع والتعدادات: tutorial/06-types.md
        - ٧. حين يخطئ شيء: tutorial/07-errors.md
        - ٨. صفحتك الأولى: tutorial/08-page.md
        - ٩. حفظ البيانات: tutorial/09-data.md
        - ١٠. إلى الإنترنت: tutorial/10-online.md
    - المحرر: editor.md
    - الملعب: playground.md
- الدليل:
    - برنامج في عدة ملفات: modules.md
    - الواجهة: ui.md
    - الخادم والبيانات: server.md
    - البناء للويب: build.md
    - النشر على الإنترنت: deploy.md
- المرجع:
    - مواصفات اللغة: SPEC.md
    - القواعد النحوية: grammar.md
    - الأمثلة: examples.md
- خارطة الطريق: ROADMAP.md

theme:
  name: material
  custom_dir: overrides
  language: ar
  direction: rtl
  favicon: assets/favicon.svg
  font: false # self-hosted in docs/assets/fonts, see dad.css
  # Lucide icons, bundled in overrides/.icons/lucide (ISC licence)
  icon:
    repo: fontawesome/brands/github
    edit: lucide/pencil
    view: lucide/eye
    menu: lucide/menu
    alternate: lucide/languages
    search: lucide/search
    close: lucide/x
    top: lucide/arrow-up
    previous: lucide/arrow-left
    next: lucide/arrow-right
    admonition:
      note: lucide/info
      abstract: lucide/list-checks
      info: lucide/info
      tip: lucide/lightbulb
      success: lucide/circle-check
      warning: lucide/triangle-alert
      failure: lucide/octagon-alert
      danger: lucide/octagon-alert
      example: lucide/flask-conical
      quote: lucide/quote
  # Follow the device first; the toggle then cycles light → dark → device.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle: { icon: lucide/sun-moon, name: "المظهر: حسب الجهاز" }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: lucide/sun, name: "المظهر: فاتح" }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: lucide/moon, name: "المظهر: داكن" }
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - navigation.footer

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ar
          name: العربية
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Ḍād · ضاد
          site_description: A modern Arabic programming language for complete web apps — UI, server and data in one language.
          copyright: Ḍād is released under the <a href="https://github.com/mtwalli/dad-lang/blob/main/LICENSE">MIT License</a>
          theme:
            direction: ltr
            palette:
              - media: "(prefers-color-scheme)"
                primary: custom
                accent: custom
                toggle: { icon: lucide/sun-moon, name: "Theme: follow device" }
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle: { icon: lucide/sun, name: "Theme: light" }
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle: { icon: lucide/moon, name: "Theme: dark" }
          nav:
              - Home: index.md
              - Get started:
                  - Install: install.md
                  - Tutorial:
                      - tutorial/index.md
                      - 1. Getting started: tutorial/01-start.md
                      - 2. Values and names: tutorial/02-values.md
                      - 3. Decisions and loops: tutorial/03-control.md
                      - 4. Functions: tutorial/04-functions.md
                      - 5. Lists and maps: tutorial/05-lists.md
                      - 6. Types and enums: tutorial/06-types.md
                      - 7. When things go wrong: tutorial/07-errors.md
                      - 8. Your first page: tutorial/08-page.md
                      - 9. Saving data: tutorial/09-data.md
                      - 10. Going online: tutorial/10-online.md
                  - Editor: editor.md
                  - Playground: playground.md
              - Guide:
                  - Programs in several files: modules.md
                  - Interface: ui.md
                  - Server and data: server.md
                  - Building for the web: build.md
                  - Putting a program online: deploy.md
              - Reference:
                  - Language specification: SPEC.md
                  - Grammar: grammar.md
                  - Examples: examples.md
              - Roadmap: ROADMAP.md

hooks:
  - overrides/hooks/cache_bust.py
  - overrides/hooks/anchors.py
  - overrides/hooks/search.py
  - overrides/hooks/redirects.py

extra_css:
  - assets/dad.css

extra_javascript:
  - assets/playground.js
  - assets/dad-fx.js

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

exclude_docs: |
  grammar.ebnf

extra:
  social:
    - icon: material/microsoft-visual-studio-code
      link: https://marketplace.visualstudio.com/items?itemName=mtwalli.dad-lang
      name: Ḍād for VS Code
    - icon: fontawesome/brands/github
      link: https://github.com/mtwalli/dad-lang
      name: Ḍād on GitHub
